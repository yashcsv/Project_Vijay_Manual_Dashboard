<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const pagesBase = '/Project_Vijay_Manual_Dashboard'

      import('/src/main.jsx').catch(async () => {
        const cssHref = `${pagesBase}/assets/app.css`
        if (!document.querySelector(`link[href="${cssHref}"]`)) {
          const link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = cssHref
          document.head.appendChild(link)
        }

        await import(`${pagesBase}/assets/app.js`)
      })
    </script>
  </body>
</html>
